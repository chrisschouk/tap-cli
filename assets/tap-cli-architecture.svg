<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#141124"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cd5c5c"/>
      <stop offset="100%" stop-color="#e8a04a"/>
    </linearGradient>
  </defs>

  <rect width="720" height="220" rx="12" fill="#0d0b16"/>

  <!-- CLI box -->
  <rect x="30" y="60" width="160" height="100" rx="10" fill="url(#box)" stroke="#cd5c5c" stroke-width="1.5"/>
  <text x="110" y="92" text-anchor="middle" font-size="13" fill="#e8e6ee" font-weight="bold">tap-cli</text>
  <text x="110" y="112" text-anchor="middle" font-size="10" fill="#7b7485">Terminal interface</text>
  <text x="110" y="128" text-anchor="middle" font-size="10" fill="#7b7485">npm install</text>
  <text x="110" y="144" text-anchor="middle" font-size="10" fill="#7b7485">@totalaudiopromo/tap-cli</text>

  <!-- Arrow -->
  <line x1="190" y1="110" x2="240" y2="110" stroke="#e05252" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="240,104 252,110 240,116" fill="#e05252"/>

  <!-- API box -->
  <rect x="260" y="60" width="160" height="100" rx="10" fill="url(#box)" stroke="#e8a04a" stroke-width="1.5"/>
  <text x="340" y="92" text-anchor="middle" font-size="13" fill="#e8e6ee" font-weight="bold">REST API v1</text>
  <text x="340" y="112" text-anchor="middle" font-size="10" fill="#7b7485">totalaudiopromo.com</text>
  <text x="340" y="128" text-anchor="middle" font-size="10" fill="#7b7485">/api/v1/*</text>
  <text x="340" y="144" text-anchor="middle" font-size="10" fill="#7b7485">Scoped API keys</text>

  <!-- Arrow -->
  <line x1="420" y1="110" x2="470" y2="110" stroke="#e05252" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="470,104 482,110 470,116" fill="#e05252"/>

  <!-- Workspace box -->
  <rect x="490" y="40" width="200" height="140" rx="10" fill="url(#box)" stroke="#28c840" stroke-width="1.5"/>
  <text x="590" y="70" text-anchor="middle" font-size="13" fill="#e8e6ee" font-weight="bold">Your Workspace</text>

  <text x="505" y="94" font-size="11" fill="#28c840">●</text>
  <text x="520" y="94" font-size="10" fill="#e8e6ee">Campaigns</text>
  <text x="505" y="110" font-size="11" fill="#28c840">●</text>
  <text x="520" y="110" font-size="10" fill="#e8e6ee">Contacts</text>
  <text x="505" y="126" font-size="11" fill="#28c840">●</text>
  <text x="520" y="126" font-size="10" fill="#e8e6ee">Pitches</text>
  <text x="505" y="142" font-size="11" fill="#28c840">●</text>
  <text x="520" y="142" font-size="10" fill="#e8e6ee">Skills</text>
  <text x="505" y="158" font-size="11" fill="#28c840">●</text>
  <text x="520" y="158" font-size="10" fill="#e8e6ee">Approval Queue</text>

  <!-- Accent line -->
  <rect x="0" y="218" width="720" height="2" fill="url(#accent)" opacity="0.3"/>
</svg>